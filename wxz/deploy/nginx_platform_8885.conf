server {
    listen 8885;
    server_name _;
    client_max_body_size 514m;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/platform_8885_access.log;
    error_log  /var/log/nginx/platform_8885_error.log warn;

    location = /health {
        proxy_pass http://127.0.0.1:6006;
        include /etc/nginx/proxy_params.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /v1/audiototext {
        proxy_pass http://127.0.0.1:6006;
        include /etc/nginx/proxy_params.conf;
    }

    location ^~ /translator/ {
        proxy_pass http://127.0.0.1:6006;
        include /etc/nginx/proxy_params.conf;
    }

    location ^~ /v1/ {
        default_type application/json;
        return 404 '{"code":404,"message":"platform route not found"}';
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
    }

    location / {
        default_type application/json;
        return 404 '{"code":404,"message":"platform route not found"}';
    }
}
