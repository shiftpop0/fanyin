# ===================================================================
# nginx_offline.conf — 离线机 Nginx 负载均衡配置
# 将 localhost:6006 分发到 3 个 ASR 后端实例
# ===================================================================

upstream asr_backend {
    # ip_hash: 同一客户端IP固定到同一后端，避免同一任务请求分散到不同容器
    # 配合 2 个容器各自的 CUDA_VISIBLE_DEVICES 隔离，兼顾负载均衡与任务亲和性
    # least_conn;  
    server 127.0.0.1:8001;
    server 127.0.0.1:8002;
}

server {
    listen 6006;

    # 请求体大小限制（最大音频文件）
    client_max_body_size 200M;

    location / {
        proxy_pass http://asr_backend;

        # 透传原始请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长超时（必须 >= APIClient timeout=120s + 余量，避免超时断连触发客户端重试）
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;

        # 关闭缓冲：实时流式传输，避免磁盘 I/O 延迟
        proxy_buffering off;
    }
}
